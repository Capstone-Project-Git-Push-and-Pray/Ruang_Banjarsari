name: Continuous Integration

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  laravel-tests:
    name: Build & Tests (PHP 8.3 & Node 22)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, xml, ctype, iconv, intl, pdo, sqlite, pdo_sqlite, bcmath, fileinfo
          coverage: none

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Salin File Konfigurasi Environment Testing
        run: php -r "file_exists('.env') || copy('.env.example', '.env');"

      - name: Install Dependencies PHP (Composer)
        run: composer install -q --no-ansi --no-interaction --no-scripts --no-progress --prefer-dist

      - name: Generate Application Key
        run: php artisan key:generate

      - name: Set Directory Permissions
        run: chmod -R 777 storage bootstrap/cache

      - name: Install Frontend Dependencies & Build Assets
        run: |
          npm ci
          npm run build

      - name: Code Style Verification (Laravel Pint)
        run: ./vendor/bin/pint --test

      - name: Jalankan Unit & Feature Tests
        run: php artisan test
